# Configuração do GitHub Dependabot para Repositório PowerShell
version: 2
updates:
  # 1. GitHub Actions (Workflows e Reusable Actions)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci/cd"
      - "security"
    commit-message:
      prefix: "build(deps-dev)"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-dependencies:
        patterns:
          - "*"

  # 2. PowerShell Gallery (Módulos PS)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "powershell"
      - "security"
    commit-message:
      prefix: "fix(deps)"
      include: "scope"
    groups:
      ps-dependencies:
        patterns:
          - "*"